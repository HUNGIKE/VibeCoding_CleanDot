<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Dot Game</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='18' fill='%23d40000'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f7f7f7 0%, #ececec 100%);
      font-family: Arial, sans-serif;
      color: #222;
    }

    .wrap {
      position: relative;
      text-align: center;
      padding: 20px;
      width: min(100%, 940px);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .toolbar-actions,
    .lang-switch {
      display: flex;
      gap: 8px;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .lang-btn,
    .action-btn,
    .touch-btn {
      color: #444;
      cursor: pointer;
      user-select: none;
      padding: 7px 12px;
      border: 1px solid #999;
      border-radius: 999px;
      background: #fff;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      font-size: 13px;
      touch-action: manipulation;
    }

    .lang-btn:hover,
    .action-btn:hover,
    .touch-btn:hover {
      background: #f0f0f0;
      transform: translateY(-1px);
    }

    .lang-btn.active,
    .action-btn.active,
    .touch-btn.active {
      font-weight: bold;
      color: #fff;
      background: #555;
      border-color: #555;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      margin: 6px 0;
      color: #333;
    }

    .hint {
      color: #444;
    }

    .legend {
      width: fit-content;
      margin: 0 auto;
      text-align: left;
    }

    .dot-label {
      font-weight: bold;
    }

    .dot-red { color: #cc0000; }
    .dot-yellow { color: #d4aa00; }
    .dot-blue { color: #1e66ff; }
    .dot-green { color: #00aa38; }

    .hud {
      display: grid;
      grid-template-columns: repeat(5, minmax(110px, 1fr));
      gap: 10px;
      margin: 14px auto 4px;
      max-width: 780px;
    }

    .hud-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d7d7d7;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
    }

    .hud-label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .hud-value {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.1;
    }

    .game-area {
      position: relative;
      width: fit-content;
      margin: 12px auto 0;
    }

    .invincible-text {
      position: absolute;
      top: 10px;
      left: 14px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-weight: bold;
      font-size: 13px;
      min-width: 84px;
      text-align: center;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }

    .invincible-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .invincible-bar {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 180px;
      height: 12px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.4);
      opacity: 0;
      transition: opacity 0.18s ease;
      pointer-events: none;
    }

    .invincible-bar.visible {
      opacity: 1;
    }

    #invincibleFill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #11b94f, #54dd85);
      transition: width 0.08s linear;
    }

    canvas {
      display: block;
      margin-top: 12px;
      background: #bdbdbd;
      border: 3px solid #666;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
      max-width: 100%;
      height: auto;
    }

    .touch-controls {
      display: none;
      margin: 14px auto 0;
      width: fit-content;
      gap: 8px;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .touch-btn {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      font-size: 24px;
      font-weight: bold;
      padding: 0;
    }

    .touch-placeholder {
      width: 56px;
      height: 56px;
    }

    .status {
      font-weight: bold;
      min-height: 24px;
      margin-top: 10px;
      font-size: 18px;
    }

    .win { color: #0b7a0b; }
    .lose { color: #b30000; }
    .paused { color: #7a5a00; }

    @media (max-width: 860px) {
      .hud {
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }

      .top-bar {
        justify-content: center;
      }

      .touch-controls {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div class="toolbar-actions">
        <button id="pauseBtn" class="action-btn" type="button"></button>
        <button id="restartBtn" class="action-btn" type="button"></button>
      </div>
      <div class="lang-switch">
        <button id="lang-en" class="lang-btn" type="button">English</button>
        <button id="lang-zh" class="lang-btn" type="button">Traditional Chinese</button>
      </div>
    </div>

    <h1 id="title"></h1>
    <p id="controlHint" class="hint"></p>

    <div class="legend">
      <p class="hint"><span class="dot-label dot-red" id="legendRedLabel"></span><span id="legendRedText"></span></p>
      <p class="hint"><span class="dot-label dot-yellow" id="legendYellowLabel"></span><span id="legendYellowText"></span></p>
      <p class="hint"><span class="dot-label dot-blue" id="legendBlueLabel"></span><span id="legendBlueText"></span></p>
      <p class="hint"><span class="dot-label dot-green" id="legendGreenLabel"></span><span id="legendGreenText"></span></p>
    </div>

    <div class="hud">
      <div class="hud-card"><span class="hud-label" id="hudTimeLabel"></span><div class="hud-value" id="hudTimeValue">0.0s</div></div>
      <div class="hud-card"><span class="hud-label" id="hudBestLabel"></span><div class="hud-value" id="hudBestValue">—</div></div>
      <div class="hud-card"><span class="hud-label" id="hudYellowLabel"></span><div class="hud-value" id="hudYellowValue">0</div></div>
      <div class="hud-card"><span class="hud-label" id="hudBlueLabel"></span><div class="hud-value" id="hudBlueValue">0</div></div>
      <div class="hud-card"><span class="hud-label" id="hudGreenLabel"></span><div class="hud-value" id="hudGreenValue">0</div></div>
    </div>

    <div class="game-area">
      <div id="invincibleText" class="invincible-text"></div>
      <div id="invincibleBar" class="invincible-bar"><div id="invincibleFill"></div></div>
      <canvas id="game" width="780" height="420"></canvas>
    </div>

    <div id="touchControls" class="touch-controls" aria-label="Touch controls">
      <div class="touch-row">
        <div class="touch-placeholder"></div>
        <button class="touch-btn" type="button" data-dir="ArrowUp">↑</button>
        <div class="touch-placeholder"></div>
      </div>
      <div class="touch-row">
        <button class="touch-btn" type="button" data-dir="ArrowLeft">←</button>
        <button class="touch-btn" type="button" data-dir="ArrowDown">↓</button>
        <button class="touch-btn" type="button" data-dir="ArrowRight">→</button>
      </div>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const langEnBtn = document.getElementById('lang-en');
    const langZhBtn = document.getElementById('lang-zh');
    const pauseBtn = document.getElementById('pauseBtn');
    const restartBtn = document.getElementById('restartBtn');
    const invincibleTextEl = document.getElementById('invincibleText');
    const invincibleBarEl = document.getElementById('invincibleBar');
    const invincibleFillEl = document.getElementById('invincibleFill');
    const hudTimeValueEl = document.getElementById('hudTimeValue');
    const hudBestValueEl = document.getElementById('hudBestValue');
    const hudYellowValueEl = document.getElementById('hudYellowValue');
    const hudBlueValueEl = document.getElementById('hudBlueValue');
    const hudGreenValueEl = document.getElementById('hudGreenValue');
    const touchButtons = Array.from(document.querySelectorAll('.touch-btn'));

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const RED_RADIUS = 10;
    const YELLOW_RADIUS = 8;
    const BLUE_RADIUS = 8;
    const GREEN_RADIUS = 8;
    const RED_SPEED = 210;
    const BLUE_SPEED = 170;
    const YELLOW_COUNT = 50;
    const GREEN_COUNT = 10;
    const NEW_BLUE_SAFE_MS = 3000;
    const RED_INVINCIBLE_MS = 3000;
    const MAX_RED_INVINCIBLE_MS = 20000;
    const MAX_ANGLE_JITTER = Math.PI / 18;
    const BEST_TIME_STORAGE_KEY = 'red-dot-game-best-time-ms';

    let keys = {};
    let touchKeys = {};
    let gameOver = false;
    let paused = false;
    let hasStarted = false;
    let animationFrameId = null;
    let lastTime = 0;
    let currentLang = 'en';
    let statusKey = 'STATUS_READY';
    let statusParams = {};
    let elapsedMs = 0;
    let bestTimeMs = null;
    let moveTarget = null;

    let red;
    let yellows = [];
    let blues = [];
    let greens = [];

    const I18N = {
      'zh-Hant': {
        TITLE: '紅點清除黃點',
        CONTROL_HINT: '方向鍵 / WASD / 觸控按鈕移動，也可點擊畫面自動前往，P 暫停，R 重新開始，空白鍵開始',
        LEGEND_RED_LABEL: '● 紅點：',
        LEGEND_RED_TEXT: '玩家控制的點；',
        LEGEND_YELLOW_LABEL: '● 黃點：',
        LEGEND_YELLOW_TEXT: '碰到後會被清除，並轉成藍點',
        LEGEND_BLUE_LABEL: '● 藍點：',
        LEGEND_BLUE_TEXT: '不可碰到藍點',
        LEGEND_GREEN_LABEL: '● 綠點：',
        LEGEND_GREEN_TEXT: '碰到後紅點獲得 3 秒不受影響狀態（最多累加至 20 秒）',
        HUD_TIME: '目前時間',
        HUD_BEST: '最佳成績',
        HUD_YELLOW: '剩餘黃點',
        HUD_BLUE: '藍點數量',
        HUD_GREEN: '剩餘綠點',
        HUD_BEST_EMPTY: '尚無',
        STATUS_READY: '按開始、空白鍵或 R 開始新的一局',
        STATUS_START: '開始',
        STATUS_WIN: '你贏了！耗時 {TIME}，按 R 再玩一次',
        STATUS_LOSE: '你輸了！按 R 重新開始',
        STATUS_PAUSED: '已暫停，按 P 繼續',
        STATUS_WAITING: '準備好了嗎？按開始、空白鍵或 R 開始',
        LANG_EN: 'English',
        LANG_ZH: 'Traditional Chinese',
        INVINCIBLE_REMAINING: '無敵 {SECONDS} 秒',
        PAUSE: '暫停',
        RESUME: '繼續',
        RESTART: '重新開始',
        START: '開始遊戲',
        TAP_HINT: '手機上可使用下方方向鍵操作'
      },
      en: {
        TITLE: 'Red Dot Clears Yellow Dots',
        CONTROL_HINT: 'Use arrow keys, WASD, or touch buttons, or click the arena to move there. P to pause, R to reset, Space to start',
        LEGEND_RED_LABEL: '● Red Dot: ',
        LEGEND_RED_TEXT: 'Player-controlled dot;',
        LEGEND_YELLOW_LABEL: '● Yellow Dot: ',
        LEGEND_YELLOW_TEXT: 'Clear them to turn them into blue hazards',
        LEGEND_BLUE_LABEL: '● Blue Dot: ',
        LEGEND_BLUE_TEXT: 'Do not touch blue dots',
        LEGEND_GREEN_LABEL: '● Green Dot: ',
        LEGEND_GREEN_TEXT: 'Gain 3 seconds of invulnerability (stack up to 20 seconds)',
        HUD_TIME: 'Current Time',
        HUD_BEST: 'Best Time',
        HUD_YELLOW: 'Yellow Left',
        HUD_BLUE: 'Blue Dots',
        HUD_GREEN: 'Green Left',
        HUD_BEST_EMPTY: 'None',
        STATUS_READY: 'Press Start, Space, or R to begin a new run',
        STATUS_START: 'Go!',
        STATUS_WIN: 'You win! Time: {TIME}. Press R to play again',
        STATUS_LOSE: 'You lose! Press R to restart',
        STATUS_PAUSED: 'Paused. Press P to continue',
        STATUS_WAITING: 'Ready? Press Start, Space, or R to begin',
        LANG_EN: 'English',
        LANG_ZH: 'Traditional Chinese',
        INVINCIBLE_REMAINING: 'Shield {SECONDS}s',
        PAUSE: 'Pause',
        RESUME: 'Resume',
        RESTART: 'Restart',
        START: 'Start Game',
        TAP_HINT: 'On mobile, use the touch controls below'
      }
    };

    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || key;
    }

    function tf(key, values = {}) {
      let text = t(key);
      for (const [name, value] of Object.entries(values)) {
        text = text.replaceAll(`{${name}}`, String(value));
      }
      return text;
    }

    function formatSeconds(ms) {
      return `${(ms / 1000).toFixed(1)}s`;
    }

    function detectInitialLanguage() {
      const langs = Array.isArray(navigator.languages) && navigator.languages.length
        ? navigator.languages
        : [navigator.language || ''];

      const prefersTraditionalChinese = langs.some((lang) => {
        const normalized = String(lang).toLowerCase();
        return normalized.includes('zh-hant') || normalized === 'zh-tw' || normalized === 'zh-hk' || normalized === 'zh-mo';
      });

      return prefersTraditionalChinese ? 'zh-Hant' : 'en';
    }

    function loadBestTime() {
      try {
        const raw = localStorage.getItem(BEST_TIME_STORAGE_KEY);
        const parsed = Number(raw);
        bestTimeMs = Number.isFinite(parsed) && parsed > 0 ? parsed : null;
      } catch {
        bestTimeMs = null;
      }
    }

    function saveBestTime(ms) {
      bestTimeMs = ms;
      try {
        localStorage.setItem(BEST_TIME_STORAGE_KEY, String(ms));
      } catch {
        // ignore storage errors
      }
    }

    function setStatus(key, params = {}, className = 'status') {
      statusKey = key;
      statusParams = params;
      statusEl.className = className;
      statusEl.textContent = tf(statusKey, statusParams);
    }

    function updateHUD() {
      hudTimeValueEl.textContent = formatSeconds(elapsedMs);
      hudBestValueEl.textContent = bestTimeMs == null ? t('HUD_BEST_EMPTY') : formatSeconds(bestTimeMs);
      hudYellowValueEl.textContent = String(yellows.length);
      hudBlueValueEl.textContent = String(blues.length);
      hudGreenValueEl.textContent = String(greens.length);
    }

    function updateButtons() {
      pauseBtn.textContent = paused ? t('RESUME') : t('PAUSE');
      pauseBtn.classList.toggle('active', paused);
      restartBtn.textContent = hasStarted ? t('RESTART') : t('START');
    }

    function renderTexts() {
      document.getElementById('title').textContent = t('TITLE');
      document.getElementById('controlHint').textContent = `${t('CONTROL_HINT')} · ${t('TAP_HINT')}`;
      document.getElementById('legendRedLabel').textContent = t('LEGEND_RED_LABEL');
      document.getElementById('legendRedText').textContent = t('LEGEND_RED_TEXT');
      document.getElementById('legendYellowLabel').textContent = t('LEGEND_YELLOW_LABEL');
      document.getElementById('legendYellowText').textContent = t('LEGEND_YELLOW_TEXT');
      document.getElementById('legendBlueLabel').textContent = t('LEGEND_BLUE_LABEL');
      document.getElementById('legendBlueText').textContent = t('LEGEND_BLUE_TEXT');
      document.getElementById('legendGreenLabel').textContent = t('LEGEND_GREEN_LABEL');
      document.getElementById('legendGreenText').textContent = t('LEGEND_GREEN_TEXT');
      document.getElementById('hudTimeLabel').textContent = t('HUD_TIME');
      document.getElementById('hudBestLabel').textContent = t('HUD_BEST');
      document.getElementById('hudYellowLabel').textContent = t('HUD_YELLOW');
      document.getElementById('hudBlueLabel').textContent = t('HUD_BLUE');
      document.getElementById('hudGreenLabel').textContent = t('HUD_GREEN');
      langEnBtn.textContent = t('LANG_EN');
      langZhBtn.textContent = t('LANG_ZH');
      langEnBtn.classList.toggle('active', currentLang === 'en');
      langZhBtn.classList.toggle('active', currentLang === 'zh-Hant');
      statusEl.textContent = tf(statusKey, statusParams);
      updateButtons();
      updateHUD();
      updateInvincibleUI();
    }

    function setLanguage(lang) {
      currentLang = lang;
      renderTexts();
      draw(performance.now());
    }

    function updateInvincibleUI(now = performance.now()) {
      const remainingMs = Math.max(0, red ? red.safeUntil - now : 0);
      invincibleFillEl.style.width = `${(remainingMs / MAX_RED_INVINCIBLE_MS) * 100}%`;
      invincibleTextEl.textContent = remainingMs > 0
        ? tf('INVINCIBLE_REMAINING', { SECONDS: Math.ceil(remainingMs / 1000) })
        : '';
      invincibleTextEl.classList.toggle('visible', remainingMs > 0);
      invincibleBarEl.classList.toggle('visible', remainingMs > 0);
    }

    function distance(ax, ay, bx, by) {
      return Math.hypot(ax - bx, ay - by);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function randomPoint(radius) {
      return {
        x: radius + Math.random() * (WIDTH - radius * 2),
        y: radius + Math.random() * (HEIGHT - radius * 2),
      };
    }

    function normalize(dx, dy) {
      const len = Math.hypot(dx, dy);
      if (len === 0) return { x: 1, y: 0 };
      return { x: dx / len, y: dy / len };
    }

    function applyAngleJitter(dx, dy, maxJitter = MAX_ANGLE_JITTER) {
      const baseAngle = Math.atan2(dy, dx);
      const jitter = (Math.random() * 2 - 1) * maxJitter;
      const angle = baseAngle + jitter;
      const speed = Math.hypot(dx, dy) || BLUE_SPEED;
      return {
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
      };
    }

    function overlaps(x, y, radius, items, gap = 12) {
      return items.some((item) => distance(x, y, item.x, item.y) < radius + item.radius + gap);
    }

    function createDots(count, radius, existingItems = [], centerGap = 90) {
      const result = [];
      let attempts = 0;

      while (result.length < count && attempts < 10000) {
        attempts += 1;
        const p = randomPoint(radius);
        if (distance(p.x, p.y, WIDTH / 2, HEIGHT / 2) < centerGap) continue;
        if (overlaps(p.x, p.y, radius, result)) continue;
        if (overlaps(p.x, p.y, radius, existingItems)) continue;
        result.push({ x: p.x, y: p.y, radius });
      }

      return result;
    }

    function cancelLoop() {
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }

    function queueLoop() {
      cancelLoop();
      animationFrameId = requestAnimationFrame(loop);
    }

    function prepareRound() {
      red = {
        x: WIDTH / 2,
        y: HEIGHT / 2,
        radius: RED_RADIUS,
        safeUntil: 0,
      };
      yellows = createDots(YELLOW_COUNT, YELLOW_RADIUS);
      greens = createDots(GREEN_COUNT, GREEN_RADIUS, yellows);
      blues = [];
      keys = {};
      touchKeys = {};
      gameOver = false;
      paused = false;
      hasStarted = false;
      lastTime = 0;
      elapsedMs = 0;
      moveTarget = null;
      setStatus('STATUS_WAITING');
      renderTexts();
      cancelLoop();
      draw(performance.now());
    }

    function startGame() {
      if (hasStarted && !gameOver && !paused) return;
      gameOver = false;
      paused = false;
      hasStarted = true;
      lastTime = 0;
      setStatus('STATUS_START');
      renderTexts();
      queueLoop();
    }

    function resetGame() {
      prepareRound();
      startGame();
    }

    function togglePause() {
      if (!hasStarted || gameOver) return;
      paused = !paused;
      if (paused) {
        setStatus('STATUS_PAUSED', {}, 'status paused');
        lastTime = 0;
        renderTexts();
        draw(performance.now());
      } else {
        setStatus('STATUS_START');
        renderTexts();
        queueLoop();
      }
    }

    function getInputAxis() {
      let dx = 0;
      let dy = 0;
      if (keys.ArrowLeft || keys.a || keys.A || touchKeys.ArrowLeft) dx -= 1;
      if (keys.ArrowRight || keys.d || keys.D || touchKeys.ArrowRight) dx += 1;
      if (keys.ArrowUp || keys.w || keys.W || touchKeys.ArrowUp) dy -= 1;
      if (keys.ArrowDown || keys.s || keys.S || touchKeys.ArrowDown) dy += 1;
      return { dx, dy };
    }

    function clearMoveTarget() {
      moveTarget = null;
    }

    function setMoveTarget(x, y) {
      moveTarget = {
        x: clamp(x, red.radius, WIDTH - red.radius),
        y: clamp(y, red.radius, HEIGHT - red.radius),
      };
    }

    function updateRed(dt) {
      const { dx, dy } = getInputAxis();

      if (dx !== 0 || dy !== 0) {
        clearMoveTarget();
        const dir = normalize(dx, dy);
        red.x += dir.x * RED_SPEED * dt;
        red.y += dir.y * RED_SPEED * dt;
      } else if (moveTarget) {
        const toTargetX = moveTarget.x - red.x;
        const toTargetY = moveTarget.y - red.y;
        const distanceToTarget = Math.hypot(toTargetX, toTargetY);

        if (distanceToTarget <= RED_SPEED * dt) {
          red.x = moveTarget.x;
          red.y = moveTarget.y;
          clearMoveTarget();
        } else {
          const dir = normalize(toTargetX, toTargetY);
          red.x += dir.x * RED_SPEED * dt;
          red.y += dir.y * RED_SPEED * dt;
        }
      }

      red.x = clamp(red.x, red.radius, WIDTH - red.radius);
      red.y = clamp(red.y, red.radius, HEIGHT - red.radius);
    }

    function convertYellowToBlue(index, now) {
      const yellow = yellows[index];
      const dir = normalize(yellow.x - red.x, yellow.y - red.y);
      const velocity = applyAngleJitter(dir.x * BLUE_SPEED, dir.y * BLUE_SPEED);

      blues.push({
        x: yellow.x,
        y: yellow.y,
        radius: BLUE_RADIUS,
        vx: velocity.vx,
        vy: velocity.vy,
        safeUntil: now + NEW_BLUE_SAFE_MS,
      });

      yellows.splice(index, 1);
      updateHUD();

      if (yellows.length === 0) {
        gameOver = true;
        if (bestTimeMs == null || elapsedMs < bestTimeMs) {
          saveBestTime(elapsedMs);
        }
        setStatus('STATUS_WIN', { TIME: formatSeconds(elapsedMs) }, 'status win');
        renderTexts();
        cancelLoop();
      }
    }

    function updateYellowCollisions(now) {
      for (let i = yellows.length - 1; i >= 0; i -= 1) {
        const y = yellows[i];
        if (distance(red.x, red.y, y.x, y.y) <= red.radius + y.radius) {
          convertYellowToBlue(i, now);
          if (gameOver) return;
        }
      }
    }

    function updateGreenCollisions(now) {
      for (let i = greens.length - 1; i >= 0; i -= 1) {
        const g = greens[i];
        if (distance(red.x, red.y, g.x, g.y) <= red.radius + g.radius) {
          red.safeUntil = Math.min(now + MAX_RED_INVINCIBLE_MS, Math.max(red.safeUntil, now) + RED_INVINCIBLE_MS);
          greens.splice(i, 1);
          updateHUD();
          updateInvincibleUI(now);
        }
      }
    }

    function bounceBlue(blue, flipX, flipY) {
      const nextVx = flipX ? -blue.vx : blue.vx;
      const nextVy = flipY ? -blue.vy : blue.vy;
      const jittered = applyAngleJitter(nextVx, nextVy, MAX_ANGLE_JITTER / 2);
      blue.vx = jittered.vx;
      blue.vy = jittered.vy;
    }

    function updateBlues(dt, now) {
      const redSafe = now < red.safeUntil;

      for (const blue of blues) {
        blue.x += blue.vx * dt;
        blue.y += blue.vy * dt;

        if (blue.x - blue.radius <= 0) {
          blue.x = blue.radius;
          bounceBlue(blue, true, false);
        } else if (blue.x + blue.radius >= WIDTH) {
          blue.x = WIDTH - blue.radius;
          bounceBlue(blue, true, false);
        }

        if (blue.y - blue.radius <= 0) {
          blue.y = blue.radius;
          bounceBlue(blue, false, true);
        } else if (blue.y + blue.radius >= HEIGHT) {
          blue.y = HEIGHT - blue.radius;
          bounceBlue(blue, false, true);
        }

        const blueSafe = now < blue.safeUntil;
        if (!blueSafe && !redSafe && distance(red.x, red.y, blue.x, blue.y) <= red.radius + blue.radius) {
          gameOver = true;
          setStatus('STATUS_LOSE', {}, 'status lose');
          renderTexts();
          cancelLoop();
          return;
        }
      }
    }

    function drawYellows() {
      for (const y of yellows) {
        ctx.beginPath();
        ctx.arc(y.x, y.y, y.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd400';
        ctx.fill();
      }
    }

    function drawGreens() {
      for (const g of greens) {
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#00cc44';
        ctx.fill();
      }
    }

    function drawBlues(now) {
      for (const blue of blues) {
        const safe = now < blue.safeUntil;
        ctx.globalAlpha = safe && Math.floor(now / 180) % 2 === 0 ? 0.25 : 1;
        ctx.beginPath();
        ctx.arc(blue.x, blue.y, blue.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#1e66ff';
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function drawRed(now) {
      const remaining = red.safeUntil - now;
      const safe = remaining > 0;
      const blinkInterval = 150;

      if (safe) {
        const ratio = Math.max(0, Math.min(1, remaining / MAX_RED_INVINCIBLE_MS));
        const indicatorRadius = red.radius + 5;
        const startAngle = -Math.PI / 2;
        const endAngle = startAngle + Math.PI * 2 * ratio;

        ctx.beginPath();
        ctx.moveTo(red.x, red.y);
        ctx.arc(red.x, red.y, indicatorRadius, startAngle, endAngle, false);
        ctx.closePath();
        ctx.fillStyle = '#00cc44';
        ctx.fill();
      }

      ctx.globalAlpha = safe && Math.floor(now / blinkInterval) % 2 === 0 ? 0.3 : 1;
      ctx.beginPath();
      ctx.arc(red.x, red.y, red.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'red';
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    function drawMoveTarget() {
      if (!moveTarget || !hasStarted || paused || gameOver) return;

      ctx.save();
      ctx.strokeStyle = 'rgba(180, 40, 40, 0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(moveTarget.x, moveTarget.y, 14, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(moveTarget.x - 8, moveTarget.y);
      ctx.lineTo(moveTarget.x + 8, moveTarget.y);
      ctx.moveTo(moveTarget.x, moveTarget.y - 8);
      ctx.lineTo(moveTarget.x, moveTarget.y + 8);
      ctx.stroke();
      ctx.restore();
    }

    function drawOverlay(text, buttonText) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.fillRect(WIDTH / 2 - 190, HEIGHT / 2 - 78, 380, 156);
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 2;
      ctx.strokeRect(WIDTH / 2 - 190, HEIGHT / 2 - 78, 380, 156);

      ctx.fillStyle = '#222';
      ctx.font = 'bold 28px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, WIDTH / 2, HEIGHT / 2 - 18);

      ctx.fillStyle = '#444';
      ctx.font = 'bold 18px Arial';
      ctx.fillText(buttonText, WIDTH / 2, HEIGHT / 2 + 28);
    }

    function draw(now) {
      updateInvincibleUI(now);
      updateHUD();
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      drawYellows();
      drawGreens();
      drawBlues(now);
      drawMoveTarget();
      drawRed(now);

      if (!hasStarted && !gameOver) {
        drawOverlay(t('STATUS_WAITING'), t('START'));
      } else if (paused && !gameOver) {
        drawOverlay(t('STATUS_PAUSED'), t('RESUME'));
      }
    }

    function loop(timestamp) {
      if (gameOver) {
        draw(timestamp);
        return;
      }

      if (paused || !hasStarted) {
        draw(timestamp);
        return;
      }

      if (lastTime === 0) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.025);
      lastTime = timestamp;
      elapsedMs += dt * 1000;

      updateRed(dt);
      updateYellowCollisions(timestamp);
      if (!gameOver) {
        updateGreenCollisions(timestamp);
        updateBlues(dt, timestamp);
      }
      draw(timestamp);

      if (!gameOver && !paused && hasStarted) {
        animationFrameId = requestAnimationFrame(loop);
      }
    }

    function setTouchKey(direction, active) {
      touchKeys[direction] = active;
    }

    function releaseAllTouchKeys() {
      touchKeys = {};
    }

    function getCanvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const scaleY = HEIGHT / rect.height;
      return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY,
      };
    }

    function runBasicTests() {
      console.assert(t('TITLE') === I18N[currentLang].TITLE, 't() should return localized title');
      console.assert(tf('INVINCIBLE_REMAINING', { SECONDS: 7 }).includes('7'), 'tf() should replace placeholders');
      const n = normalize(3, 4);
      console.assert(Math.abs(n.x - 0.6) < 1e-9 && Math.abs(n.y - 0.8) < 1e-9, 'normalize() should normalize vectors');
      console.assert(['en', 'zh-Hant'].includes(detectInitialLanguage()), 'detectInitialLanguage() should return a supported language');
      console.assert(formatSeconds(1534) === '1.5s', 'formatSeconds() should show 1 decimal place');
      console.assert(createDots(5, 8).length === 5, 'createDots() should create requested number of dots under normal conditions');
      touchKeys = { ArrowLeft: true };
      console.assert(getInputAxis().dx === -1 && getInputAxis().dy === 0, 'touch controls should feed movement input');
      releaseAllTouchKeys();
      red = { x: 100, y: 100, radius: RED_RADIUS, safeUntil: 0 };
      setMoveTarget(-50, HEIGHT + 50);
      console.assert(moveTarget.x === RED_RADIUS && moveTarget.y === HEIGHT - RED_RADIUS, 'setMoveTarget() should clamp inside the arena');
      setMoveTarget(160, 100);
      updateRed(0.5);
      console.assert(red.x > 100 && red.y === 100, 'updateRed() should move toward click target when no manual input is held');
      clearMoveTarget();
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;

      if ([
        'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
        'w', 'a', 's', 'd', 'W', 'A', 'S', 'D', ' '
      ].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === ' ' && !hasStarted) {
        startGame();
      }

      if (e.key === 'r' || e.key === 'R') {
        resetGame();
      }

      if (e.key === 'p' || e.key === 'P') {
        togglePause();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    window.addEventListener('blur', () => {
      keys = {};
      releaseAllTouchKeys();
      clearMoveTarget();
    });

    canvas.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      event.preventDefault();
      if (!hasStarted) startGame();
      const point = getCanvasPoint(event);
      setMoveTarget(point.x, point.y);
      draw(performance.now());
    });

    for (const button of touchButtons) {
      const direction = button.dataset.dir;
      const startPress = (event) => {
        event.preventDefault();
        if (!hasStarted) startGame();
        setTouchKey(direction, true);
        button.classList.add('active');
      };
      const endPress = (event) => {
        if (event) event.preventDefault();
        setTouchKey(direction, false);
        button.classList.remove('active');
      };

      button.addEventListener('pointerdown', startPress);
      button.addEventListener('pointerup', endPress);
      button.addEventListener('pointercancel', endPress);
      button.addEventListener('pointerleave', endPress);
    }

    langEnBtn.addEventListener('click', () => setLanguage('en'));
    langZhBtn.addEventListener('click', () => setLanguage('zh-Hant'));
    pauseBtn.addEventListener('click', () => {
      if (!hasStarted) {
        startGame();
        return;
      }
      togglePause();
    });
    restartBtn.addEventListener('click', resetGame);

    loadBestTime();
    currentLang = detectInitialLanguage();
    prepareRound();
    runBasicTests();
  </script>
</body>
</html>
