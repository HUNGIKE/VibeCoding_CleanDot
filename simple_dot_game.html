<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Dot Game</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='18' fill='%23d40000'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f7f7f7 0%, #ececec 100%);
      font-family: Arial, sans-serif;
      color: #222;
    }

    .wrap {
      position: relative;
      text-align: center;
      padding: 20px;
      width: min(100%, 940px);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .toolbar-actions,
    .lang-switch,
    .difficulty-switch,
    .audio-switch {
      display: flex;
      gap: 8px;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .lang-btn,
    .action-btn,
    .touch-btn {
      color: #444;
      cursor: pointer;
      user-select: none;
      padding: 7px 12px;
      border: 1px solid #999;
      border-radius: 999px;
      background: #fff;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      font-size: 13px;
      touch-action: manipulation;
    }

    .lang-btn:hover,
    .action-btn:hover,
    .touch-btn:hover {
      background: #f0f0f0;
      transform: translateY(-1px);
    }

    .lang-btn.active,
    .action-btn.active,
    .touch-btn.active {
      font-weight: bold;
      color: #fff;
      background: #555;
      border-color: #555;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      margin: 6px 0;
      color: #333;
    }

    .hint {
      color: #444;
    }

    .legend {
      width: fit-content;
      margin: 0 auto;
      text-align: left;
    }

    .dot-label {
      font-weight: bold;
    }

    .dot-red { color: #cc0000; }
    .dot-yellow { color: #d4aa00; }
    .dot-blue { color: #1e66ff; }
    .dot-green { color: #00aa38; }
    .dot-purple { color: #7a3cff; }

    .hud {
      display: grid;
      grid-template-columns: repeat(7, minmax(104px, 1fr));
      gap: 10px;
      margin: 14px auto 4px;
      max-width: 960px;
    }

    .hud-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d7d7d7;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
    }

    .hud-label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .hud-value {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.1;
    }

    .game-area {
      position: relative;
      width: fit-content;
      margin: 12px auto 0;
    }

    .invincible-text {
      position: absolute;
      top: 10px;
      left: 14px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-weight: bold;
      font-size: 13px;
      min-width: 84px;
      text-align: center;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }

    .invincible-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .invincible-bar {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 180px;
      height: 12px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.4);
      opacity: 0;
      transition: opacity 0.18s ease;
      pointer-events: none;
    }

    .invincible-bar.visible {
      opacity: 1;
    }

    #invincibleFill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #11b94f, #54dd85);
      transition: width 0.08s linear;
    }

    canvas {
      display: block;
      margin-top: 12px;
      background: #bdbdbd;
      border: 3px solid #666;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
      max-width: 100%;
      height: auto;
    }

    .touch-controls {
      display: none;
      margin: 14px auto 0;
      width: fit-content;
      gap: 8px;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .touch-btn {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      font-size: 24px;
      font-weight: bold;
      padding: 0;
    }

    .touch-placeholder {
      width: 56px;
      height: 56px;
    }

    .status {
      font-weight: bold;
      min-height: 24px;
      margin-top: 10px;
      font-size: 18px;
    }

    .win { color: #0b7a0b; }
    .lose { color: #b30000; }
    .paused { color: #7a5a00; }

    .screen-reader-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 860px) {
      .hud {
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }

      .top-bar {
        justify-content: center;
      }

      .touch-controls {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div class="toolbar-actions">
        <button id="pauseBtn" class="action-btn" type="button"></button>
        <button id="restartBtn" class="action-btn" type="button"></button>
      </div>
      <div class="difficulty-switch">
        <button id="difficulty-easy" class="action-btn" type="button">Easy</button>
        <button id="difficulty-normal" class="action-btn active" type="button">Normal</button>
        <button id="difficulty-hard" class="action-btn" type="button">Hard</button>
      </div>
      <div class="audio-switch">
        <button id="audioToggleBtn" class="action-btn" type="button">Sound: On</button>
      </div>
      <div class="lang-switch">
        <button id="lang-en" class="lang-btn" type="button">English</button>
        <button id="lang-zh" class="lang-btn" type="button">Traditional Chinese</button>
      </div>
    </div>

    <h1 id="title"></h1>
    <p id="controlHint" class="hint"></p>

    <div class="legend">
      <p class="hint"><span class="dot-label dot-red" id="legendRedLabel"></span><span id="legendRedText"></span></p>
      <p class="hint"><span class="dot-label dot-yellow" id="legendYellowLabel"></span><span id="legendYellowText"></span></p>
      <p class="hint"><span class="dot-label dot-blue" id="legendBlueLabel"></span><span id="legendBlueText"></span></p>
      <p class="hint"><span class="dot-label dot-green" id="legendGreenLabel"></span><span id="legendGreenText"></span></p>
      <p class="hint"><span class="dot-label dot-purple" id="legendPurpleLabel"></span><span id="legendPurpleText"></span></p>
    </div>

    <div class="hud">
      <div class="hud-card"><span class="hud-label" id="hudTimeLabel"></span><div class="hud-value" id="hudTimeValue">0.0s</div></div>
      <div class="hud-card"><span class="hud-label" id="hudBestLabel"></span><div class="hud-value" id="hudBestValue">—</div></div>
      <div class="hud-card"><span class="hud-label" id="hudYellowLabel"></span><div class="hud-value" id="hudYellowValue">0</div></div>
      <div class="hud-card"><span class="hud-label" id="hudBlueLabel"></span><div class="hud-value" id="hudBlueValue">0</div></div>
      <div class="hud-card"><span class="hud-label" id="hudGreenLabel"></span><div class="hud-value" id="hudGreenValue">0</div></div>
      <div class="hud-card"><span class="hud-label" id="hudComboLabel"></span><div class="hud-value" id="hudComboValue">x1</div></div>
      <div class="hud-card"><span class="hud-label" id="hudDangerLabel"></span><div class="hud-value" id="hudDangerValue">Safe</div></div>
    </div>

    <div class="game-area">
      <div id="invincibleText" class="invincible-text"></div>
      <div id="invincibleBar" class="invincible-bar"><div id="invincibleFill"></div></div>
      <canvas id="game" width="780" height="420"></canvas>
    </div>

    <div id="touchControls" class="touch-controls" aria-label="Touch controls">
      <div class="touch-row">
        <div class="touch-placeholder"></div>
        <button class="touch-btn" type="button" data-dir="ArrowUp">↑</button>
        <div class="touch-placeholder"></div>
      </div>
      <div class="touch-row">
        <button class="touch-btn" type="button" data-dir="ArrowLeft">←</button>
        <button class="touch-btn" type="button" data-dir="ArrowDown">↓</button>
        <button class="touch-btn" type="button" data-dir="ArrowRight">→</button>
      </div>
    </div>

    <div id="status" class="status"></div>
    <div id="threatAnnouncer" class="screen-reader-only" aria-live="polite"></div>
  </div>

    const I18N = {

    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || key;
    }

    function tf(key, values = {}) {
      let text = t(key);
      for (const [name, value] of Object.entries(values)) {
        text = text.replaceAll(`{${name}}`, String(value));
      }
      return text;
    }

    function formatSeconds(ms) {
      return `${(ms / 1000).toFixed(1)}s`;
    }

    function detectInitialLanguage() {
      const langs = Array.isArray(navigator.languages) && navigator.languages.length
        ? navigator.languages
        : [navigator.language || ''];

      const prefersTraditionalChinese = langs.some((lang) => {
        const normalized = String(lang).toLowerCase();
        return normalized.includes('zh-hant') || normalized === 'zh-tw' || normalized === 'zh-hk' || normalized === 'zh-mo';
      });

      return prefersTraditionalChinese ? 'zh-Hant' : 'en';
    }

    function getBestTimeStorageKey() {
      return `${BEST_TIME_STORAGE_KEY}:${currentDifficulty}`;
    }

    function loadBestTime() {
      try {
        const raw = localStorage.getItem(getBestTimeStorageKey());
        const legacyRaw = localStorage.getItem(BEST_TIME_STORAGE_KEY);
        const parsed = Number(raw ?? legacyRaw);
        bestTimeMs = Number.isFinite(parsed) && parsed > 0 ? parsed : null;
      } catch {
        bestTimeMs = null;
      }
    }

    function saveBestTime(ms) {
      bestTimeMs = ms;
      try {
        localStorage.setItem(getBestTimeStorageKey(), String(ms));
      } catch {
        // ignore storage errors
      }
    }

    function loadDifficulty() {
      try {
        const stored = localStorage.getItem(DIFFICULTY_STORAGE_KEY);
        currentDifficulty = DIFFICULTY_CONFIG[stored] ? stored : 'normal';
      } catch {
        currentDifficulty = 'normal';
      }
    }

    function saveDifficulty() {
      try {
        localStorage.setItem(DIFFICULTY_STORAGE_KEY, currentDifficulty);
      } catch {
        // ignore storage errors
      }
    }

    function loadSoundPreference() {
      try {
        const stored = localStorage.getItem(SOUND_STORAGE_KEY);
        soundEnabled = stored == null ? true : stored !== 'false';
      } catch {
        soundEnabled = true;
      }
    }

    function saveSoundPreference() {
      try {
        localStorage.setItem(SOUND_STORAGE_KEY, String(soundEnabled));
      } catch {
        // ignore storage errors
      }
    }

    function ensureAudioContext() {
      if (audioContext) return audioContext;
      const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextCtor) return null;
      audioContext = new AudioContextCtor();
      return audioContext;
    }

    async function unlockAudioContext() {
      const ctx = ensureAudioContext();
      if (!ctx) return null;
      if (ctx.state === 'suspended') {
        try {
          await ctx.resume();
        } catch {
          return ctx;
        }
      }
      return ctx;
    }

    function playSound(kind) {
      if (!soundEnabled) return;
      const ctx = ensureAudioContext();
      if (!ctx || ctx.state !== 'running') return;

      const now = ctx.currentTime;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.connect(gain);
      gain.connect(ctx.destination);

      if (kind === 'collect') {
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(620, now);
        oscillator.frequency.exponentialRampToValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.05, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
        oscillator.start(now);
        oscillator.stop(now + 0.14);
        return;
      }

      if (kind === 'powerup') {
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(420, now);
        oscillator.frequency.exponentialRampToValueAtTime(700, now + 0.09);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.07, now + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
        oscillator.start(now);
        oscillator.stop(now + 0.22);
        return;
      }

      if (kind === 'lose') {
        oscillator.type = 'sawtooth';
        oscillator.frequency.setValueAtTime(280, now);
        oscillator.frequency.exponentialRampToValueAtTime(120, now + 0.24);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.06, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
        oscillator.start(now);
        oscillator.stop(now + 0.28);
        return;
      }

      if (kind === 'win') {
        oscillator.type = 'square';
        oscillator.frequency.setValueAtTime(660, now);
        oscillator.frequency.exponentialRampToValueAtTime(990, now + 0.1);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.06, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
        oscillator.start(now);
        oscillator.stop(now + 0.3);
      }
    }

    function setStatus(key, params = {}, className = 'status') {
      statusKey = key;
      statusParams = params;
      statusEl.className = className;
      statusEl.textContent = tf(statusKey, statusParams);
    }

    function getDangerState(now = performance.now()) {
      let nearestDistance = Infinity;

      for (const blue of blues) {
        if (now < blue.safeUntil) continue;
        const edgeDistance = Math.max(0, distance(red.x, red.y, blue.x, blue.y) - red.radius - blue.radius);
        nearestDistance = Math.min(nearestDistance, edgeDistance);
      }

      if (!Number.isFinite(nearestDistance) || nearestDistance > DANGER_WARNING_DISTANCE) {
        return { key: 'DANGER_SAFE', distance: nearestDistance, intensity: 0 };
      }

      if (nearestDistance <= DANGER_HIGH_DISTANCE) {
        return {
          key: 'DANGER_HIGH',
          distance: nearestDistance,
          intensity: 1 - nearestDistance / DANGER_HIGH_DISTANCE,
        };
      }

      return {
        key: 'DANGER_WARNING',
        distance: nearestDistance,
        intensity: 1 - (nearestDistance - DANGER_HIGH_DISTANCE) / (DANGER_WARNING_DISTANCE - DANGER_HIGH_DISTANCE),
      };
    }

    function getNearestBlueThreat(now = performance.now()) {
      let nearestBlue = null;
      let nearestDistance = Infinity;

      for (const blue of blues) {
        if (now < blue.safeUntil) continue;
        const centerDistance = distance(red.x, red.y, blue.x, blue.y);
        if (centerDistance < nearestDistance) {
          nearestDistance = centerDistance;
          nearestBlue = blue;
        }
      }

      return nearestBlue
        ? { blue: nearestBlue, distance: nearestDistance }
        : null;
    }

    function getThreatDirectionKey(dx, dy) {
      const angle = Math.atan2(dy, dx);
      const slice = Math.round(angle / (Math.PI / 4));

      switch (slice) {
        case 0:
          return 'THREAT_RIGHT';
        case 1:
          return 'THREAT_DOWN_RIGHT';
        case 2:
          return 'THREAT_DOWN';
        case 3:
          return 'THREAT_DOWN_LEFT';
        case 4:
        case -4:
          return 'THREAT_LEFT';
        case -3:
          return 'THREAT_UP_LEFT';
        case -2:
          return 'THREAT_UP';
        default:
          return 'THREAT_UP_RIGHT';
      }
    }

    function updateThreatAnnouncer(now = performance.now()) {
      if (!threatAnnouncerEl) return;
      if (!hasStarted || paused || gameOver) {
        threatAnnouncerEl.textContent = '';
        lastThreatAnnouncement = '';
        return;
      }

      const threat = getNearestBlueThreat(now);
      if (!threat) {
        threatAnnouncerEl.textContent = '';
        lastThreatAnnouncement = '';
        return;
      }

      const dx = threat.blue.x - red.x;
      const dy = threat.blue.y - red.y;
      const direction = t(getThreatDirectionKey(dx, dy));
      const distanceLabel = `${Math.max(0, Math.round(threat.distance - red.radius - threat.blue.radius))} px`;
      const announcement = tf('THREAT_ANNOUNCE', { DIRECTION: direction, DISTANCE: distanceLabel });

      if (announcement !== lastThreatAnnouncement) {
        threatAnnouncerEl.textContent = announcement;
        lastThreatAnnouncement = announcement;
      }
    }

    function updateHUD(now = performance.now()) {
      const danger = getDangerState(now);
      const comboActive = comboCount > 1 && now < comboExpiresAt;
      hudTimeValueEl.textContent = formatSeconds(elapsedMs);
      hudBestValueEl.textContent = bestTimeMs == null ? t('HUD_BEST_EMPTY') : formatSeconds(bestTimeMs);
      hudYellowValueEl.textContent = String(yellows.length);
      hudBlueValueEl.textContent = String(blues.length);
      hudGreenValueEl.textContent = String(greens.length);
      hudComboValueEl.textContent = `x${Math.max(1, comboCount)}`;
      hudComboValueEl.style.color = comboActive ? '#9a3d00' : '#444';
      hudDangerValueEl.textContent = t(danger.key);
      hudDangerValueEl.style.color = danger.key === 'DANGER_HIGH'
        ? '#b30000'
        : danger.key === 'DANGER_WARNING'
          ? '#9a6400'
          : '#0b7a0b';
    }

    function updateButtons() {
      pauseBtn.textContent = paused ? t('RESUME') : t('PAUSE');
      pauseBtn.classList.toggle('active', paused);
      restartBtn.textContent = hasStarted ? t('RESTART') : t('START');
      audioToggleBtn.textContent = soundEnabled ? t('SOUND_ON') : t('SOUND_OFF');
      audioToggleBtn.classList.toggle('active', soundEnabled);
      difficultyEasyBtn.textContent = t('DIFFICULTY_EASY');
      difficultyNormalBtn.textContent = t('DIFFICULTY_NORMAL');
      difficultyHardBtn.textContent = t('DIFFICULTY_HARD');
      difficultyEasyBtn.classList.toggle('active', currentDifficulty === 'easy');
      difficultyNormalBtn.classList.toggle('active', currentDifficulty === 'normal');
      difficultyHardBtn.classList.toggle('active', currentDifficulty === 'hard');
      difficultyEasyBtn.title = `${t('DIFFICULTY_LABEL')}: ${t('DIFFICULTY_EASY')}`;
      difficultyNormalBtn.title = `${t('DIFFICULTY_LABEL')}: ${t('DIFFICULTY_NORMAL')}`;
      difficultyHardBtn.title = `${t('DIFFICULTY_LABEL')}: ${t('DIFFICULTY_HARD')}`;
    }

    function renderTexts() {
      document.getElementById('title').textContent = t('TITLE');
      document.getElementById('controlHint').textContent = `${t('CONTROL_HINT')} · ${t('TAP_HINT')}`;
      document.getElementById('legendRedLabel').textContent = t('LEGEND_RED_LABEL');
      document.getElementById('legendRedText').textContent = t('LEGEND_RED_TEXT');
      document.getElementById('legendYellowLabel').textContent = t('LEGEND_YELLOW_LABEL');
      document.getElementById('legendYellowText').textContent = t('LEGEND_YELLOW_TEXT');
      document.getElementById('legendBlueLabel').textContent = t('LEGEND_BLUE_LABEL');
      document.getElementById('legendBlueText').textContent = t('LEGEND_BLUE_TEXT');
      document.getElementById('legendGreenLabel').textContent = t('LEGEND_GREEN_LABEL');
      document.getElementById('legendGreenText').textContent = t('LEGEND_GREEN_TEXT');
      document.getElementById('legendPurpleLabel').textContent = t('LEGEND_PURPLE_LABEL');
      document.getElementById('legendPurpleText').textContent = t('LEGEND_PURPLE_TEXT');
      document.getElementById('hudTimeLabel').textContent = t('HUD_TIME');
      document.getElementById('hudBestLabel').textContent = t('HUD_BEST');
      document.getElementById('hudYellowLabel').textContent = t('HUD_YELLOW');
      document.getElementById('hudBlueLabel').textContent = t('HUD_BLUE');
      document.getElementById('hudGreenLabel').textContent = t('HUD_GREEN');
      document.getElementById('hudComboLabel').textContent = t('HUD_COMBO');
      document.getElementById('hudDangerLabel').textContent = t('HUD_DANGER');
      langEnBtn.textContent = t('LANG_EN');
      langZhBtn.textContent = t('LANG_ZH');
      langEnBtn.classList.toggle('active', currentLang === 'en');
      langZhBtn.classList.toggle('active', currentLang === 'zh-Hant');
      statusEl.textContent = tf(statusKey, statusParams);
      updateButtons();
      updateHUD();
      updateInvincibleUI();
    }

    function setLanguage(lang) {
      currentLang = lang;
      renderTexts();
      draw(performance.now());
    }

    function updateInvincibleUI(now = performance.now()) {
      const remainingMs = Math.max(0, red ? red.safeUntil - now : 0);
      invincibleFillEl.style.width = `${(remainingMs / MAX_RED_INVINCIBLE_MS) * 100}%`;
      invincibleTextEl.textContent = remainingMs > 0
        ? tf('INVINCIBLE_REMAINING', { SECONDS: Math.ceil(remainingMs / 1000) })
        : '';
      invincibleTextEl.classList.toggle('visible', remainingMs > 0);
      invincibleBarEl.classList.toggle('visible', remainingMs > 0);
    }

    function distance(ax, ay, bx, by) {
      return Math.hypot(ax - bx, ay - by);
    }

    function getNearestYellow() {
      let nearest = null;
      let nearestDistance = Infinity;

      for (const yellow of yellows) {
        const currentDistance = distance(red.x, red.y, yellow.x, yellow.y);
        if (currentDistance < nearestDistance) {
          nearestDistance = currentDistance;
          nearest = yellow;
        }
      }

      return nearest;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function randomPoint(radius) {
      return {
        x: radius + Math.random() * (WIDTH - radius * 2),
        y: radius + Math.random() * (HEIGHT - radius * 2),
      };
    }

    function normalize(dx, dy) {
      const len = Math.hypot(dx, dy);
      if (len === 0) return { x: 1, y: 0 };
      return { x: dx / len, y: dy / len };
    }

    function applyAngleJitter(dx, dy, maxJitter = MAX_ANGLE_JITTER) {
      const baseAngle = Math.atan2(dy, dx);
      const jitter = (Math.random() * 2 - 1) * maxJitter;
      const angle = baseAngle + jitter;
      const speed = Math.hypot(dx, dy) || BLUE_SPEED;
      return {
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
      };
    }

    function overlaps(x, y, radius, items, gap = 12) {
      return items.some((item) => distance(x, y, item.x, item.y) < radius + item.radius + gap);
    }

    function createDots(count, radius, existingItems = [], centerGap = 90) {
      const result = [];
      let attempts = 0;

      while (result.length < count && attempts < 10000) {
        attempts += 1;
        const p = randomPoint(radius);
        if (distance(p.x, p.y, WIDTH / 2, HEIGHT / 2) < centerGap) continue;
        if (overlaps(p.x, p.y, radius, result)) continue;
        if (overlaps(p.x, p.y, radius, existingItems)) continue;
        result.push({ x: p.x, y: p.y, radius });
      }

      return result;
    }

    function cancelLoop() {
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }

    function queueLoop() {
      cancelLoop();
      animationFrameId = requestAnimationFrame(loop);
    }

    function prepareRound() {
      const config = DIFFICULTY_CONFIG[currentDifficulty] || DIFFICULTY_CONFIG.normal;
      red = {
        x: WIDTH / 2,
        y: HEIGHT / 2,
        radius: RED_RADIUS,
        safeUntil: 0,
      };
      yellows = createDots(config.yellowCount, YELLOW_RADIUS);
      initialYellowCount = yellows.length;
      greens = createDots(config.greenCount, GREEN_RADIUS, yellows);
      purples = createDots(config.purpleCount, PURPLE_RADIUS, [...yellows, ...greens]);
      blues = [];
      freezeUntil = 0;
      keys = {};
      touchKeys = {};
      gameOver = false;
      paused = false;
      hasStarted = false;
      lastTime = 0;
      elapsedMs = 0;
      moveTarget = null;
      lastRunSummary = null;
      comboCount = 0;
      maxCombo = 0;
      comboExpiresAt = 0;
      lastYellowPickupAt = 0;
      setStatus('STATUS_WAITING');
      renderTexts();
      cancelLoop();
      draw(performance.now());
    }

    async function startGame() {
      if (hasStarted && !gameOver && !paused) return;
      await unlockAudioContext();
      gameOver = false;
      paused = false;
      hasStarted = true;
      lastTime = 0;
      setStatus('STATUS_START');
      renderTexts();
      queueLoop();
    }

    function resetGame() {
      prepareRound();
      startGame();
    }

    function togglePause() {
      if (!hasStarted || gameOver) return;
      paused = !paused;
      if (paused) {
        setStatus('STATUS_PAUSED', {}, 'status paused');
        lastTime = 0;
        renderTexts();
        draw(performance.now());
      } else {
        setStatus('STATUS_START');
        renderTexts();
        queueLoop();
      }
    }

    function getInputAxis() {
      let dx = 0;
      let dy = 0;
      if (keys.ArrowLeft || keys.a || keys.A || touchKeys.ArrowLeft) dx -= 1;
      if (keys.ArrowRight || keys.d || keys.D || touchKeys.ArrowRight) dx += 1;
      if (keys.ArrowUp || keys.w || keys.W || touchKeys.ArrowUp) dy -= 1;
      if (keys.ArrowDown || keys.s || keys.S || touchKeys.ArrowDown) dy += 1;
      return { dx, dy };
    }

    function clearMoveTarget() {
      moveTarget = null;
    }

    function setMoveTarget(x, y) {
      moveTarget = {
        x: clamp(x, red.radius, WIDTH - red.radius),
        y: clamp(y, red.radius, HEIGHT - red.radius),
      };
    }

    function getComboSpeedMultiplier(now = performance.now()) {
      if (comboCount <= 1 || now >= comboExpiresAt) return 1;
      return 1 + Math.min(MAX_COMBO_SPEED_BONUS, (comboCount - 1) * COMBO_SPEED_STEP);
    }

    function updateCombo(now) {
      if (comboCount > 0 && now >= comboExpiresAt) {
        comboCount = 0;
        comboExpiresAt = 0;
      }
    }

    function registerYellowPickup(now) {
      comboCount = lastYellowPickupAt > 0 && now - lastYellowPickupAt <= COMBO_WINDOW_MS
        ? comboCount + 1
        : 1;
      comboExpiresAt = now + COMBO_WINDOW_MS;
      lastYellowPickupAt = now;
      maxCombo = Math.max(maxCombo, comboCount);
    }

    function updateRed(dt, now = performance.now()) {
      const { dx, dy } = getInputAxis();
      const speedMultiplier = getComboSpeedMultiplier(now);
      const redSpeed = (DIFFICULTY_CONFIG[currentDifficulty] || DIFFICULTY_CONFIG.normal).redSpeed * speedMultiplier;

      if (dx !== 0 || dy !== 0) {
        clearMoveTarget();
        const dir = normalize(dx, dy);
        red.x += dir.x * redSpeed * dt;
        red.y += dir.y * redSpeed * dt;
      } else if (moveTarget) {
        const toTargetX = moveTarget.x - red.x;
        const toTargetY = moveTarget.y - red.y;
        const distanceToTarget = Math.hypot(toTargetX, toTargetY);

        if (distanceToTarget <= redSpeed * dt) {
          red.x = moveTarget.x;
          red.y = moveTarget.y;
          clearMoveTarget();
        } else {
          const dir = normalize(toTargetX, toTargetY);
          red.x += dir.x * redSpeed * dt;
          red.y += dir.y * redSpeed * dt;
        }
      }

      red.x = clamp(red.x, red.radius, WIDTH - red.radius);
      red.y = clamp(red.y, red.radius, HEIGHT - red.radius);
    }

    function convertYellowToBlue(index, now) {
      const yellow = yellows[index];
      const config = DIFFICULTY_CONFIG[currentDifficulty] || DIFFICULTY_CONFIG.normal;
      const dir = normalize(yellow.x - red.x, yellow.y - red.y);
      const velocity = applyAngleJitter(dir.x * config.blueSpeed, dir.y * config.blueSpeed);

      blues.push({
        x: yellow.x,
        y: yellow.y,
        radius: BLUE_RADIUS,
        vx: velocity.vx,
        vy: velocity.vy,
        safeUntil: now + config.newBlueSafeMs,
      });

      playSound('collect');
      registerYellowPickup(now);
      yellows.splice(index, 1);
      updateHUD(now);

      if (yellows.length === 0) {
        gameOver = true;
        const wasNewBest = bestTimeMs == null || elapsedMs < bestTimeMs;
        if (wasNewBest) {
          saveBestTime(elapsedMs);
        }
        lastRunSummary = {
          result: 'win',
          timeMs: elapsedMs,
          bestTimeMs,
          difficulty: currentDifficulty,
          newBest: wasNewBest,
          maxCombo,
        };
        playSound('win');
        setStatus('STATUS_WIN', { TIME: formatSeconds(elapsedMs) }, 'status win');
        renderTexts();
        cancelLoop();
      }
    }

    function updateYellowCollisions(now) {
      for (let i = yellows.length - 1; i >= 0; i -= 1) {
        const y = yellows[i];
        if (distance(red.x, red.y, y.x, y.y) <= red.radius + y.radius) {
          convertYellowToBlue(i, now);
          if (gameOver) return;
        }
      }
    }

    function updateGreenCollisions(now) {
      for (let i = greens.length - 1; i >= 0; i -= 1) {
        const g = greens[i];
        if (distance(red.x, red.y, g.x, g.y) <= red.radius + g.radius) {
          red.safeUntil = Math.min(now + MAX_RED_INVINCIBLE_MS, Math.max(red.safeUntil, now) + RED_INVINCIBLE_MS);
          playSound('powerup');
          greens.splice(i, 1);
          updateHUD();
          updateInvincibleUI(now);
        }
      }
    }

    function updatePurpleCollisions(now) {
      for (let i = purples.length - 1; i >= 0; i -= 1) {
        const p = purples[i];
        if (distance(red.x, red.y, p.x, p.y) <= red.radius + p.radius) {
          freezeUntil = Math.max(freezeUntil, now) + PURPLE_FREEZE_MS;
          playSound('powerup');
          purples.splice(i, 1);
        }
      }
    }

    function bounceBlue(blue, flipX, flipY) {
      const nextVx = flipX ? -blue.vx : blue.vx;
      const nextVy = flipY ? -blue.vy : blue.vy;
      const jittered = applyAngleJitter(nextVx, nextVy, MAX_ANGLE_JITTER / 2);
      blue.vx = jittered.vx;
      blue.vy = jittered.vy;
    }

    function updateBlues(dt, now) {
      const redSafe = now < red.safeUntil;
      const freezeActive = now < freezeUntil;

      for (const blue of blues) {
        if (!freezeActive) {
          blue.x += blue.vx * dt;
          blue.y += blue.vy * dt;
        }

        if (blue.x - blue.radius <= 0) {
          blue.x = blue.radius;
          bounceBlue(blue, true, false);
        } else if (blue.x + blue.radius >= WIDTH) {
          blue.x = WIDTH - blue.radius;
          bounceBlue(blue, true, false);
        }

        if (blue.y - blue.radius <= 0) {
          blue.y = blue.radius;
          bounceBlue(blue, false, true);
        } else if (blue.y + blue.radius >= HEIGHT) {
          blue.y = HEIGHT - blue.radius;
          bounceBlue(blue, false, true);
        }

        const blueSafe = now < blue.safeUntil;
        if (!blueSafe && !redSafe && distance(red.x, red.y, blue.x, blue.y) <= red.radius + blue.radius) {
          gameOver = true;
          lastRunSummary = {
            result: 'lose',
            timeMs: elapsedMs,
            bestTimeMs,
            difficulty: currentDifficulty,
            newBest: false,
            maxCombo,
          };
          playSound('lose');
          setStatus('STATUS_LOSE', {}, 'status lose');
          renderTexts();
          cancelLoop();
          return;
        }
      }
    }

    function drawYellows() {
      for (const y of yellows) {
        ctx.beginPath();
        ctx.arc(y.x, y.y, y.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd400';
        ctx.fill();
      }
    }

    function drawGreens() {
      for (const g of greens) {
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#00cc44';
        ctx.fill();
      }
    }

    function drawPurples(now) {
      const freezeActive = now < freezeUntil;
      for (const p of purples) {
        ctx.save();
        const pulse = 0.75 + Math.sin(now / 140 + p.x * 0.01) * 0.15;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 5, 0, Math.PI * 2);
        ctx.fillStyle = freezeActive ? 'rgba(122, 60, 255, 0.14)' : 'rgba(122, 60, 255, 0.08)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * pulse, 0, Math.PI * 2);
        ctx.fillStyle = '#7a3cff';
        ctx.fill();
        ctx.restore();
      }
    }

    function drawBlues(now) {
      const freezeActive = now < freezeUntil;
      for (const blue of blues) {
        const safe = now < blue.safeUntil;
        ctx.globalAlpha = safe && Math.floor(now / 180) % 2 === 0 ? 0.25 : 1;
        ctx.beginPath();
        ctx.arc(blue.x, blue.y, blue.radius, 0, Math.PI * 2);
        ctx.fillStyle = freezeActive ? '#72b6ff' : '#1e66ff';
        ctx.fill();
        if (freezeActive) {
          ctx.strokeStyle = 'rgba(255,255,255,0.85)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }

    function drawNearestYellowGuide(now) {
      if (!hasStarted || paused || gameOver || yellows.length === 0) return;

      const target = getNearestYellow();
      if (!target) return;

      const pulse = 0.6 + (Math.sin(now / 170) + 1) * 0.2;
      const progress = initialYellowCount > 0
        ? 1 - yellows.length / initialYellowCount
        : 0;
      const lineAlpha = 0.14 + progress * 0.18;

      ctx.save();
      ctx.setLineDash([6, 7]);
      ctx.lineDashOffset = -(now / 42);
      ctx.strokeStyle = `rgba(212, 170, 0, ${lineAlpha.toFixed(3)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(red.x, red.y);
      ctx.lineTo(target.x, target.y);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.arc(target.x, target.y, target.radius + 8 + pulse * 7, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(212, 170, 0, ${(0.32 + pulse * 0.2).toFixed(3)})`;
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(target.x, target.y, target.radius + 15 + pulse * 5, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(212, 170, 0, ${(0.12 + pulse * 0.12).toFixed(3)})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    function drawDangerAura(now) {
      if (!hasStarted || paused || gameOver) return;
      const danger = getDangerState(now);
      if (danger.intensity <= 0) return;

      const pulse = 0.65 + 0.35 * (0.5 + Math.sin(now / 120) * 0.5);
      const radius = red.radius + 18 + danger.intensity * 28;
      const alpha = Math.min(0.36, 0.08 + danger.intensity * 0.28) * pulse;

      ctx.save();
      ctx.beginPath();
      ctx.arc(red.x, red.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220, 0, 0, ${alpha.toFixed(3)})`;
      ctx.fill();
      ctx.restore();
    }

    function drawNearestThreatIndicator(now) {
      if (!hasStarted || paused || gameOver) return;

      const threat = getNearestBlueThreat(now);
      if (!threat) return;

      const dx = threat.blue.x - red.x;
      const dy = threat.blue.y - red.y;
      const edgeDistance = Math.max(0, threat.distance - red.radius - threat.blue.radius);
      const danger = getDangerState(now);
      const alpha = danger.key === 'DANGER_HIGH' ? 0.95 : danger.key === 'DANGER_WARNING' ? 0.72 : 0.42;
      const length = danger.key === 'DANGER_HIGH' ? 36 : 28;
      const width = danger.key === 'DANGER_HIGH' ? 16 : 13;
      const arrowDistance = red.radius + 26;
      const dir = normalize(dx, dy);
      const baseX = red.x + dir.x * arrowDistance;
      const baseY = red.y + dir.y * arrowDistance;
      const tipX = baseX + dir.x * length;
      const tipY = baseY + dir.y * length;
      const perpX = -dir.y;
      const perpY = dir.x;

      ctx.save();
      ctx.fillStyle = `rgba(179, 0, 0, ${alpha.toFixed(3)})`;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.lineTo(baseX + perpX * width, baseY + perpY * width);
      ctx.lineTo(baseX - perpX * width, baseY - perpY * width);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      const labelX = baseX + dir.x * (length + 22);
      const labelY = baseY + dir.y * (length + 18);
      const distanceLabel = `${Math.round(edgeDistance)}px`;
      ctx.fillStyle = `rgba(60, 20, 20, ${Math.min(0.95, alpha + 0.08).toFixed(3)})`;
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = dir.x >= 0 ? 'left' : 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(distanceLabel, labelX, labelY);
      ctx.restore();
    }

    function drawRed(now) {
      const remaining = red.safeUntil - now;
      const safe = remaining > 0;
      const blinkInterval = 150;
      const comboActive = comboCount > 1 && now < comboExpiresAt;

      if (safe) {
        const ratio = Math.max(0, Math.min(1, remaining / MAX_RED_INVINCIBLE_MS));
        const indicatorRadius = red.radius + 5;
        const startAngle = -Math.PI / 2;
        const endAngle = startAngle + Math.PI * 2 * ratio;

        ctx.beginPath();
        ctx.moveTo(red.x, red.y);
        ctx.arc(red.x, red.y, indicatorRadius, startAngle, endAngle, false);
        ctx.closePath();
        ctx.fillStyle = '#00cc44';
        ctx.fill();
      }

      if (comboActive) {
        const comboPulse = 0.7 + (Math.sin(now / 95) + 1) * 0.18;
        ctx.save();
        ctx.beginPath();
        ctx.arc(red.x, red.y, red.radius + 8 + comboCount * 0.8, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 153, 0, ${(0.11 + comboPulse * 0.12).toFixed(3)})`;
        ctx.fill();
        ctx.fillStyle = '#9a3d00';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(`x${comboCount}`, red.x, red.y - red.radius - 10);
        ctx.restore();
      }

      ctx.globalAlpha = safe && Math.floor(now / blinkInterval) % 2 === 0 ? 0.3 : 1;
      ctx.beginPath();
      ctx.arc(red.x, red.y, red.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'red';
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    function drawFreezeOverlay(now) {
      if (now >= freezeUntil || !hasStarted || paused || gameOver) return;
      const remainingMs = freezeUntil - now;
      const alpha = Math.min(0.14, 0.06 + (remainingMs / PURPLE_FREEZE_MS) * 0.08);
      ctx.save();
      ctx.fillStyle = `rgba(120, 180, 255, ${alpha.toFixed(3)})`;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.fillStyle = '#193b80';
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(tf('FREEZE_REMAINING', { SECONDS: (remainingMs / 1000).toFixed(1) }), WIDTH / 2, 14);
      ctx.restore();
    }

    function drawMoveTarget() {
      if (!moveTarget || !hasStarted || paused || gameOver) return;

      ctx.save();
      ctx.strokeStyle = 'rgba(180, 40, 40, 0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(moveTarget.x, moveTarget.y, 14, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(moveTarget.x - 8, moveTarget.y);
      ctx.lineTo(moveTarget.x + 8, moveTarget.y);
      ctx.moveTo(moveTarget.x, moveTarget.y - 8);
      ctx.lineTo(moveTarget.x, moveTarget.y + 8);
      ctx.stroke();
      ctx.restore();
    }

    function drawOverlay(text, buttonText) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.fillRect(WIDTH / 2 - 190, HEIGHT / 2 - 78, 380, 156);
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 2;
      ctx.strokeRect(WIDTH / 2 - 190, HEIGHT / 2 - 78, 380, 156);

      ctx.fillStyle = '#222';
      ctx.font = 'bold 28px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, WIDTH / 2, HEIGHT / 2 - 18);

      ctx.fillStyle = '#444';
      ctx.font = 'bold 18px Arial';
      ctx.fillText(buttonText, WIDTH / 2, HEIGHT / 2 + 28);
    }

    function drawResultOverlay() {
      if (!lastRunSummary) return;

      const cardWidth = 430;
      const cardHeight = 228;
      const left = WIDTH / 2 - cardWidth / 2;
      const top = HEIGHT / 2 - cardHeight / 2;
      const titleKey = lastRunSummary.result === 'win' ? 'RESULT_WIN_TITLE' : 'RESULT_LOSE_TITLE';
      const difficultyLabel = t(`DIFFICULTY_${String(lastRunSummary.difficulty || 'normal').toUpperCase()}`);
      const titleColor = lastRunSummary.result === 'win' ? '#0b7a0b' : '#b30000';

      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
      ctx.fillRect(left, top, cardWidth, cardHeight);
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 2;
      ctx.strokeRect(left, top, cardWidth, cardHeight);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.fillStyle = titleColor;
      ctx.font = 'bold 31px Arial';
      ctx.fillText(t(titleKey), WIDTH / 2, top + 40);

      if (lastRunSummary.newBest) {
        ctx.fillStyle = '#0d8f41';
        ctx.font = 'bold 20px Arial';
        ctx.fillText(t('RESULT_NEW_BEST'), WIDTH / 2, top + 72);
      }

      ctx.fillStyle = '#333';
      ctx.font = 'bold 20px Arial';
      ctx.fillText(tf('RESULT_TIME', { TIME: formatSeconds(lastRunSummary.timeMs || 0) }), WIDTH / 2, top + 110);

      ctx.font = '16px Arial';
      ctx.fillStyle = '#4a4a4a';
      const bestLine = lastRunSummary.bestTimeMs == null
        ? t('RESULT_BEST_EMPTY')
        : tf('RESULT_BEST', { TIME: formatSeconds(lastRunSummary.bestTimeMs) });
      ctx.fillText(bestLine, WIDTH / 2, top + 140);
      ctx.fillText(tf('RESULT_DIFFICULTY', { DIFFICULTY: difficultyLabel }), WIDTH / 2, top + 162);
      ctx.fillText(tf('RESULT_COMBO', { COMBO: Math.max(1, lastRunSummary.maxCombo || 0) }), WIDTH / 2, top + 184);

      ctx.font = 'bold 15px Arial';
      ctx.fillStyle = '#444';
      ctx.fillText(t('RESULT_RESTART_HINT'), WIDTH / 2, top + 204);
      ctx.restore();
    }

    function draw(now) {
      updateInvincibleUI(now);
      updateHUD();
      updateThreatAnnouncer(now);
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      drawYellows();
      drawGreens();
      drawPurples(now);
      drawBlues(now);
      drawNearestYellowGuide(now);
      drawMoveTarget();
      drawFreezeOverlay(now);
      drawDangerAura(now);
      drawNearestThreatIndicator(now);
      drawRed(now);

      if (!hasStarted && !gameOver) {
        drawOverlay(t('STATUS_WAITING'), t('START'));
      } else if (paused && !gameOver) {
        drawOverlay(t('STATUS_PAUSED'), t('RESUME'));
      } else if (gameOver) {
        drawResultOverlay();
      }
    }

    function loop(timestamp) {
      if (gameOver) {
        draw(timestamp);
        return;
      }

      if (paused || !hasStarted) {
        draw(timestamp);
        return;
      }

      if (lastTime === 0) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.025);
      lastTime = timestamp;
      elapsedMs += dt * 1000;

      updateCombo(timestamp);
      updateRed(dt, timestamp);
      updateYellowCollisions(timestamp);
      if (!gameOver) {
        updateGreenCollisions(timestamp);
        updatePurpleCollisions(timestamp);
        updateBlues(dt, timestamp);
      }
      draw(timestamp);

      if (!gameOver && !paused && hasStarted) {
        animationFrameId = requestAnimationFrame(loop);
      }
    }

    function setTouchKey(direction, active) {
      touchKeys[direction] = active;
    }

    function releaseAllTouchKeys() {
      touchKeys = {};
    }

    function getCanvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const scaleY = HEIGHT / rect.height;
      return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY,
      };
    }

    function setDifficulty(difficulty, options = {}) {
      if (!DIFFICULTY_CONFIG[difficulty] || currentDifficulty === difficulty) return;
      currentDifficulty = difficulty;
      saveDifficulty();
      loadBestTime();
      renderTexts();
      if (options.restart !== false) {
        prepareRound();
      }
    }

    function runBasicTests() {
      const originalState = {
        keys,
        touchKeys,
        gameOver,
        paused,
        hasStarted,
        lastTime,
        statusKey,
        statusParams: { ...statusParams },
        elapsedMs,
        bestTimeMs,
        moveTarget: moveTarget ? { ...moveTarget } : null,
        currentDifficulty,
        soundEnabled,
        lastRunSummary: lastRunSummary ? { ...lastRunSummary } : null,
        red: red ? { ...red } : null,
        yellows: yellows.map((item) => ({ ...item })),
        blues: blues.map((item) => ({ ...item })),
        greens: greens.map((item) => ({ ...item })),
        purples: purples.map((item) => ({ ...item })),
        freezeUntil,
        initialYellowCount,
        comboCount,
        maxCombo,
        comboExpiresAt,
        lastYellowPickupAt,
      };

      try {
        console.assert(t('TITLE') === I18N[currentLang].TITLE, 't() should return localized title');
        console.assert(tf('INVINCIBLE_REMAINING', { SECONDS: 7 }).includes('7'), 'tf() should replace placeholders');
        const n = normalize(3, 4);
        console.assert(Math.abs(n.x - 0.6) < 1e-9 && Math.abs(n.y - 0.8) < 1e-9, 'normalize() should normalize vectors');
        console.assert(['en', 'zh-Hant'].includes(detectInitialLanguage()), 'detectInitialLanguage() should return a supported language');
        console.assert(formatSeconds(1534) === '1.5s', 'formatSeconds() should show 1 decimal place');
        console.assert(createDots(5, 8).length === 5, 'createDots() should create requested number of dots under normal conditions');
        red = { x: 100, y: 100, radius: RED_RADIUS, safeUntil: 0 };
        yellows = [
          { x: 180, y: 100, radius: YELLOW_RADIUS },
          { x: 130, y: 100, radius: YELLOW_RADIUS }
        ];
        console.assert(getNearestYellow().x === 130, 'getNearestYellow() should return the closest yellow target');
        touchKeys = { ArrowLeft: true };
        console.assert(getInputAxis().dx === -1 && getInputAxis().dy === 0, 'touch controls should feed movement input');
        releaseAllTouchKeys();
        red = { x: 100, y: 100, radius: RED_RADIUS, safeUntil: 0 };
        setMoveTarget(-50, HEIGHT + 50);
        console.assert(moveTarget.x === RED_RADIUS && moveTarget.y === HEIGHT - RED_RADIUS, 'setMoveTarget() should clamp inside the arena');
        setMoveTarget(160, 100);
        updateRed(0.5);
        console.assert(red.x > 100 && red.y === 100, 'updateRed() should move toward click target when no manual input is held');
        clearMoveTarget();
        console.assert(getBestTimeStorageKey().endsWith(currentDifficulty), 'best time storage key should include the current difficulty');
        soundEnabled = true;
        console.assert(t(soundEnabled ? 'SOUND_ON' : 'SOUND_OFF').length > 0, 'sound toggle labels should exist');
        soundEnabled = false;
        console.assert(t(soundEnabled ? 'SOUND_ON' : 'SOUND_OFF').length > 0, 'sound off label should exist');
        soundEnabled = true;
        console.assert(DIFFICULTY_CONFIG.easy.yellowCount < DIFFICULTY_CONFIG.hard.yellowCount, 'difficulty presets should differ');
        comboCount = 2;
        comboExpiresAt = 1000;
        console.assert(getComboSpeedMultiplier(900) > 1, 'combo speed multiplier should increase during an active streak');
        updateCombo(1001);
        console.assert(comboCount === 0, 'combo should expire after the combo window ends');
        registerYellowPickup(1200);
        registerYellowPickup(2400);
        console.assert(comboCount === 2 && maxCombo >= 2, 'registerYellowPickup() should build a combo inside the combo window');
        purples = [{ x: red.x, y: red.y, radius: PURPLE_RADIUS }];
        freezeUntil = 0;
        updatePurpleCollisions(1000);
        console.assert(freezeUntil === 1000 + PURPLE_FREEZE_MS, 'purple pickup should start a freeze timer');
        blues = [{ x: 120, y: 100, radius: BLUE_RADIUS, vx: 100, vy: 0, safeUntil: 0 }];
        updateBlues(1, 1001);
        console.assert(blues[0].x === 120, 'frozen blue dots should not move while freeze is active');
        freezeUntil = 0;
        blues = [{ x: red.x + red.radius + BLUE_RADIUS + 20, y: red.y, radius: BLUE_RADIUS, vx: 0, vy: 0, safeUntil: 0 }];
        console.assert(getDangerState(0).key === 'DANGER_HIGH', 'getDangerState() should flag nearby active blue dots as dangerous');
        const threat = getNearestBlueThreat(0);
        console.assert(threat && threat.blue.x === red.x + red.radius + BLUE_RADIUS + 20, 'getNearestBlueThreat() should return the nearest active blue dot');
        console.assert(getThreatDirectionKey(20, 0) === 'THREAT_RIGHT', 'getThreatDirectionKey() should resolve rightward hazards');
        console.assert(getThreatDirectionKey(-20, -20) === 'THREAT_UP_LEFT', 'getThreatDirectionKey() should resolve diagonal hazards');
        blues = [{ x: red.x + red.radius + BLUE_RADIUS + 220, y: red.y, radius: BLUE_RADIUS, vx: 0, vy: 0, safeUntil: 0 }];
        console.assert(getDangerState(0).key === 'DANGER_SAFE', 'getDangerState() should report safe when hazards are far away');
        blues = [];
        bestTimeMs = 4200;
        elapsedMs = 4200;
        currentDifficulty = 'hard';
        lastRunSummary = {
          result: 'win',
          timeMs: elapsedMs,
          bestTimeMs,
          difficulty: currentDifficulty,
          newBest: true,
          maxCombo: 4,
        };
        console.assert(lastRunSummary.newBest === true && lastRunSummary.bestTimeMs === 4200, 'result summary should preserve win details');
        gameOver = true;
        let resetCalls = 0;
        const originalResetGame = resetGame;
        resetGame = () => { resetCalls += 1; };
        canvas.dispatchEvent(new PointerEvent('pointerdown', { button: 0, clientX: 10, clientY: 10 }));
        console.assert(resetCalls === 1, 'clicking the arena after game over should restart');
        resetGame = originalResetGame;
      } finally {
        keys = originalState.keys;
        touchKeys = originalState.touchKeys;
        gameOver = originalState.gameOver;
        paused = originalState.paused;
        hasStarted = originalState.hasStarted;
        lastTime = originalState.lastTime;
        statusKey = originalState.statusKey;
        statusParams = { ...originalState.statusParams };
        elapsedMs = originalState.elapsedMs;
        bestTimeMs = originalState.bestTimeMs;
        moveTarget = originalState.moveTarget ? { ...originalState.moveTarget } : null;
        currentDifficulty = originalState.currentDifficulty;
        soundEnabled = originalState.soundEnabled;
        lastRunSummary = originalState.lastRunSummary ? { ...originalState.lastRunSummary } : null;
        red = originalState.red ? { ...originalState.red } : null;
        yellows = originalState.yellows.map((item) => ({ ...item }));
        blues = originalState.blues.map((item) => ({ ...item }));
        greens = originalState.greens.map((item) => ({ ...item }));
        purples = originalState.purples.map((item) => ({ ...item }));
        freezeUntil = originalState.freezeUntil;
        initialYellowCount = originalState.initialYellowCount;
        comboCount = originalState.comboCount;
        maxCombo = originalState.maxCombo;
        comboExpiresAt = originalState.comboExpiresAt;
        lastYellowPickupAt = originalState.lastYellowPickupAt;
        updateButtons();
        updateHUD();
        updateInvincibleUI();
      }
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;

      if ([
        'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
        'w', 'a', 's', 'd', 'W', 'A', 'S', 'D', ' '
      ].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === ' ' && (!hasStarted || gameOver)) {
        if (gameOver) {
          resetGame();
        } else {
          startGame();
        }
      }

      if (e.key === 'r' || e.key === 'R') {
        resetGame();
      }

      if (e.key === 'p' || e.key === 'P') {
        togglePause();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    window.addEventListener('blur', () => {
      keys = {};
      releaseAllTouchKeys();
      clearMoveTarget();
    });

    canvas.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      event.preventDefault();
      if (gameOver) {
        resetGame();
        return;
      }
      if (!hasStarted) startGame();
      const point = getCanvasPoint(event);
      setMoveTarget(point.x, point.y);
      draw(performance.now());
    });

    for (const button of touchButtons) {
      const direction = button.dataset.dir;
      const startPress = (event) => {
        event.preventDefault();
        if (!hasStarted) startGame();
        setTouchKey(direction, true);
        button.classList.add('active');
      };
      const endPress = (event) => {
        if (event) event.preventDefault();
        setTouchKey(direction, false);
        button.classList.remove('active');
      };

      button.addEventListener('pointerdown', startPress);
      button.addEventListener('pointerup', endPress);
      button.addEventListener('pointercancel', endPress);
      button.addEventListener('pointerleave', endPress);
    }

    langEnBtn.addEventListener('click', () => setLanguage('en'));
    langZhBtn.addEventListener('click', () => setLanguage('zh-Hant'));
    difficultyEasyBtn.addEventListener('click', () => setDifficulty('easy'));
    difficultyNormalBtn.addEventListener('click', () => setDifficulty('normal'));
    difficultyHardBtn.addEventListener('click', () => setDifficulty('hard'));
    audioToggleBtn.addEventListener('click', async () => {
      soundEnabled = !soundEnabled;
      saveSoundPreference();
      if (soundEnabled) {
        await unlockAudioContext();
        playSound('powerup');
      }
      renderTexts();
    });
    pauseBtn.addEventListener('click', () => {
      if (!hasStarted) {
        startGame();
        return;
      }
      togglePause();
    });
    restartBtn.addEventListener('click', resetGame);

    loadDifficulty();
    loadBestTime();
    loadSoundPreference();
    currentLang = detectInitialLanguage();
    prepareRound();
    runBasicTests();
  </script>
</body>
</html>
